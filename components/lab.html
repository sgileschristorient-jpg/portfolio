<!-- ======= CYBERLAB ======= -->
    <section id="lab" class="page">
        <div class="container">
            <div class="text-center mb-5">
                <h2 class="display-4 fw-bold">Cyber Security Lab</h2>
                <div class="mx-auto" style="width:80px;height:4px;background:var(--accent);border-radius:2px;"></div>
                <p class="text-white opacity-75 mt-3">Analyse heuristique de vulnérabilité en temps réel</p>
            </div>

            <div class="terminal-window">
                <div class="terminal-header">
                    <div class="dot red"></div>
                    <div class="dot yellow"></div>
                    <div class="dot green"></div>
                    <span class="ms-3 small text-secondary">security_scanner --target <span id="targetDisplay">none</span></span>
                </div>

                <div class="p-3">
                    <div class="input-group mb-4" style="max-width:600px;">
                        <span class="input-group-text bg-transparent border-secondary text-success">$</span>
                        <input type="text" id="urlInput" class="form-control bg-transparent border-secondary text-white"
                            placeholder="Entrez une URL (ex: google.com)">
                        <button class="btn btn-outline-info" onclick="runScanner()" id="scanBtn">Lancer l'Analyse</button>
                    </div>

                    <div class="scanner-container">
                        <div class="main-dashboard">
                            <div class="dashboard-grid">
                                <div class="metric-card" id="card-ssl">
                                    <span class="metric-label">Chiffrement SSL</span>
                                    <span class="metric-value" id="val-ssl">---</span>
                                </div>
                                <div class="metric-card" id="card-headers">
                                    <span class="metric-label">Entêtes HTTP</span>
                                    <span class="metric-value" id="val-headers">---</span>
                                </div>
                                <div class="metric-card" id="card-dns">
                                    <span class="metric-label">Sécurité DNS</span>
                                    <span class="metric-value" id="val-dns">---</span>
                                </div>
                                <div class="metric-card" id="card-rep">
                                    <span class="metric-label">Réputation</span>
                                    <span class="metric-value" id="val-rep">---</span>
                                </div>
                            </div>

                            <div class="scan-logs fira" id="results">
                                <div class="log-entry log-info">[SYSTÈME] Prêt pour l'analyse. Veuillez entrer une URL cible.</div>
                            </div>
                        </div>

                        <div class="sidebar-stats text-center">
                            <div class="radar-box mb-3" id="radar">
                                <div class="radar-sweep"></div>
                                <div class="risk-score-display">
                                    <div class="metric-label">SCORE SÉCURITÉ</div>
                                    <div class="score-big" id="riskScore">00</div>
                                </div>
                            </div>
                            <div class="badge rounded-pill bg-dark border border-secondary p-2 w-100 mb-2" id="threatLevel">STATUT : EN ATTENTE</div>
                            <div class="small opacity-50" id="ipDisplay">IP: ---.---.---.---</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
