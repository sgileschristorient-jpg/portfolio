    <script>
        /* --- 3D DATA SPHERE ENGINE --- */
        let scene, camera, renderer, particles, sphere;

        function init3D() {
            if (window.innerWidth < 768) return; // skip on mobile for perf
            if (typeof THREE === 'undefined') return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.SphereGeometry(25, 32, 32);
            const material = new THREE.PointsMaterial({
                color: 0x00f2ff,
                size: 0.2,
                transparent: true,
                opacity: 0.5
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            const wireGeo = new THREE.SphereGeometry(24, 15, 15);
            const wireMat = new THREE.MeshBasicMaterial({ color: 0x00f2ff, wireframe: true, transparent: true, opacity: 0.05 });
            sphere = new THREE.Mesh(wireGeo, wireMat);
            scene.add(sphere);

            camera.position.z = 60;
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.y += 0.002;
            particles.rotation.x += 0.001;
            sphere.rotation.y -= 0.001;
            renderer.render(scene, camera);
        }

        /* --- UI LOGIC --- */
        var VALID_PAGES = ['home', 'about', 'services', 'projects', 'proofs', 'lab'];

        // 1. Gérer la redirection transparente venant du fichier 404.html
        (function() {
            var urlParams = new URLSearchParams(window.location.search);
            var redirect = urlParams.get('redirect');
            if (redirect) {
                window.history.replaceState(null, null, redirect);
            }
        })();

        // 2. Détecter sur quelle page on se trouve
        function getCurrentPage() {
            var path = window.location.pathname;
            var match = path.match(/\/pages\/(.+)\.html$/);
            if (match && VALID_PAGES.includes(match[1])) {
                return match[1];
            }
            var hash = window.location.hash.replace('#', '').trim();
            return VALID_PAGES.includes(hash) ? hash : 'home';
        }

        function showPage(id, el, pushState) {
            if (pushState === undefined) pushState = true;
            if (!VALID_PAGES.includes(id)) id = 'home';
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            document.querySelectorAll('.nav-link').forEach(function(l) { l.classList.remove('active'); });

            var target = document.getElementById(id);
            if (target) target.classList.add('active');

            if (el) {
                el.classList.add('active');
            } else {
                var navEl = document.querySelector('.nav-link[onclick*=' + id + ']');
                if (navEl) navEl.classList.add('active');
            }

            window.scrollTo(0, 0);

            /* Update URL sans recharger (format propre) */
            if (pushState) {
                var basePath = window.location.pathname;
                if (basePath.includes('/pages/')) {
                    basePath = basePath.split('/pages/')[0];
                } else if (basePath.endsWith('index.html')) {
                    basePath = basePath.replace('index.html', '');
                }
                if (!basePath.endsWith('/')) basePath += '/';

                var urlPath = (id === 'home') ? basePath : basePath + 'pages/' + id + '.html';
                history.pushState({ page: id }, '', urlPath);
            }

            if (typeof gsap !== 'undefined') {
                gsap.fromTo('#' + id + ' .service-card, #' + id + ' .proof-card, #' + id + ' .project-card, #' + id + ' .achievement-card, #' + id + ' .thm-badge-card',
                    { y: 40, opacity: 0 },
                    { y: 0, opacity: 1, duration: 0.5, stagger: 0.07, ease: 'power3.out', clearProps: 'all' }
                );
            }
        }

        /* Handle browser back/forward buttons */
        window.addEventListener('popstate', function(e) {
            var id = (e.state && e.state.page) ? e.state.page : getCurrentPage();
            showPage(id, null, false);
        });

        function openCert(src, title) {
            document.getElementById('mImg').src = src;
            document.getElementById('mTitle').innerText = title;
            new bootstrap.Modal(document.getElementById('certModal')).show();
        }

        /* --- Custom Cursor (desktop only) --- */
        if (window.innerWidth > 768) {
            const cursor = document.getElementById('cursor');
            window.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
            });
        }

        /* --- TYPEWRITER ENGINE --- */
        function typeWriter(el, text, speed, callback) {
            el.textContent = '';
            el.style.borderRight = '2px solid var(--accent)';
            el.style.display = 'inline';
            var i = 0;
            function tick() {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                    setTimeout(tick, speed + Math.random() * 30);
                } else {
                    // blink then remove cursor
                    setTimeout(function() {
                        el.style.animation = 'cursor-blink 0.7s step-end 4';
                        setTimeout(function() {
                            el.style.borderRight = 'none';
                            el.style.animation = '';
                            if (callback) callback();
                        }, 2800);
                    }, 200);
                }
            }
            tick();
        }

        /* --- INIT --- */
        window.addEventListener('load', function() {
            // Cacher le preloader avec fluidité
            setTimeout(function() {
                var loader = document.getElementById('page-loader');
                if (loader) loader.classList.add('hidden');
            }, 400);
            if (typeof lucide !== 'undefined') lucide.createIcons();
            init3D();

            /* Charge la bonne page au démarrage */
            var startPage = getCurrentPage();
            if (startPage !== 'home') {
                showPage(startPage, null, false);
            } else {
                history.replaceState({ page: 'home' }, '', window.location.pathname);
            }

            if (typeof gsap !== 'undefined') {
                gsap.from('.glitch-text', { duration: 1.2, y: 80, opacity: 0, ease: 'power4.out' });
                gsap.from('.hero-badge', { duration: 0.8, y: -20, opacity: 0, ease: 'power3.out', delay: 0.3 });
            }

            /* --- Typewriter on subtitle after short delay --- */
            var subtitleEl = document.getElementById('hero-subtitle');
            if (subtitleEl) {
                var subtitleText = "Ingénieur de formation (L2 IST Gounghin). Je construis des infrastructures résilientes et des solutions web de haute sécurité.";
                setTimeout(function() {
                    typeWriter(subtitleEl, subtitleText, 28, null);
                }, 700);
            }
        });

        window.addEventListener('resize', () => {
            if (renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>

    <!-- Script d'inclusion des composants -->
    <script>
        async function loadComponent(id, file) {
            try {
                const response = await fetch('components/' + file);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(id).innerHTML = html;
                }
            } catch (error) {
                console.error('Erreur de chargement pour ' + file, error);
            }
        }
        async function initApp() {
            await Promise.all([
                loadComponent('about-container', 'about.html'),
                loadComponent('services-container', 'services.html'),
                loadComponent('projects-container', 'projects.html'),
                loadComponent('proofs-container', 'proofs.html'),
                loadComponent('lab-container', 'lab.html')
            ]);
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
